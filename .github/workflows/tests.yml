name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install core dependencies first
        pip install Flask==3.0.0 pytest==7.4.3 pytest-flask==1.3.0 --timeout 120
        # Install osxphotos separately with a longer timeout
        pip install "osxphotos>=0.73.4" --timeout 300 || echo "osxphotos installation failed, tests will handle this gracefully"
    
    - name: Run tests
      run: |
        pytest test_app.py -v --tb=short
    
    - name: Test application startup
      run: |
        timeout 5 python app.py &
        sleep 3
        curl -f http://localhost:5000/ || exit 1
        curl -f http://localhost:5000/health || exit 1
