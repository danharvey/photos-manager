<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Manager Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #999;
            font-size: 0.9rem;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .chart-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .chart-container {
            height: 300px;
            position: relative;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            height: 250px;
            gap: 10px;
            padding: 10px 0;
        }

        .bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px 5px 0 0;
            position: relative;
            transition: all 0.3s ease;
            min-height: 5px;
        }

        .bar:hover {
            background: linear-gradient(180deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-5px);
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
        }

        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .actions {
            text-align: center;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stat-card .value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Photos Manager</h1>
            <p>Apple Photos Analytics Dashboard</p>
        </div>

        <div id="loading" class="loading">
            Loading your photo analytics...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Photos</h3>
                    <div class="value" id="totalPhotos">-</div>
                    <div class="label">in your library</div>
                </div>
                <div class="stat-card">
                    <h3>Total Storage</h3>
                    <div class="value" id="totalStorage">-</div>
                    <div class="label">used by photos</div>
                </div>
                <div class="stat-card">
                    <h3>Average Size</h3>
                    <div class="value" id="avgSize">-</div>
                    <div class="label">per photo</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h2>Photos by Year</h2>
                    <div class="chart-container">
                        <div class="bar-chart" id="yearChart"></div>
                    </div>
                </div>

                <div class="chart-card">
                    <h2>Photos by Month (Last 12 Months)</h2>
                    <div class="chart-container">
                        <div class="bar-chart" id="monthChart"></div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            loading.style.display = 'block';
            error.style.display = 'none';
            content.style.display = 'none';

            try {
                // Fetch analytics data
                const response = await fetch('/analytics');
                if (!response.ok) {
                    throw new Error('Failed to fetch analytics data');
                }
                const data = await response.json();

                // Update stats
                document.getElementById('totalPhotos').textContent = data.total_photos.toLocaleString();
                document.getElementById('totalStorage').textContent = `${data.total_size_gb.toFixed(2)} GB`;

                // Calculate and display average size
                if (data.total_photos > 0) {
                    const avgMB = (data.total_size_mb / data.total_photos).toFixed(2);
                    document.getElementById('avgSize').textContent = `${avgMB} MB`;
                } else {
                    document.getElementById('avgSize').textContent = '0 MB';
                }

                // Create year chart
                createBarChart('yearChart', data.by_year);

                // Create month chart
                createBarChart('monthChart', data.by_month);

                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = `Error: ${err.message}. Please make sure the API is running and accessible.`;
                error.style.display = 'block';
            }
        }

        function createBarChart(elementId, data) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">No data available</p>';
                return;
            }

            const entries = Object.entries(data);
            const maxValue = Math.max(...entries.map(([_, value]) => value));

            entries.forEach(([label, value]) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                const heightPercent = maxValue > 0 ? (value / maxValue) * 100 : 0;
                bar.style.height = `${heightPercent}%`;

                const barLabel = document.createElement('div');
                barLabel.className = 'bar-label';
                barLabel.textContent = label;

                const barValue = document.createElement('div');
                barValue.className = 'bar-value';
                barValue.textContent = value.toLocaleString();

                bar.appendChild(barLabel);
                bar.appendChild(barValue);
                container.appendChild(bar);
            });
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
